<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200"><style>@keyframes travel{to{stroke-dashoffset:-640}}@keyframes breathe{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}.ribbon{animation:travel 8s linear infinite}.other{animation-duration:9.6s;animation-delay:-3s}.food{animation:breathe 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.second{animation-delay:-2.1s}@media(prefers-reduced-motion:reduce){.ribbon,.food{animation:none}}</style><defs><linearGradient id="background" x2="0" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient><clipPath id="board"><rect width="200" height="130" rx="16"/></clipPath></defs><rect x=".5" y=".5" width="99.8%" height="99.8%" rx="16" fill="#fff" stroke="#e5e7eb"/><g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="36" y="80" font-size="40" font-weight="700" letter-spacing="-.5" fill="#0f172a">Nibbles HD</text><text x="36" y="108" font-size="14" fill="#64748b">Autonomous snake. Quiet, continuous play.</text><rect x="36" y="128" width="68" height="22" rx="11" fill="#f0fdf4" stroke="#60a5fa" stroke-width=".8"/><text x="70.0" y="142" font-size="10" font-weight="500" text-anchor="middle" fill="#166534">Offline</text><rect x="112" y="128" width="76" height="22" rx="11" fill="#f0fdf4" stroke="#a78bfa" stroke-width=".8"/><text x="150.0" y="142" font-size="10" font-weight="500" text-anchor="middle" fill="#166534">8 controls</text><rect x="196" y="128" width="86" height="22" rx="11" fill="#f0fdf4" stroke="#4ade80" stroke-width=".8"/><text x="239.0" y="142" font-size="10" font-weight="500" text-anchor="middle" fill="#166534">No tracking</text><rect x="290" y="128" width="90" height="22" rx="11" fill="#f0fdf4" stroke="#fbbf24" stroke-width=".8"/><text x="335.0" y="142" font-size="10" font-weight="500" text-anchor="middle" fill="#166534">No analytics</text></g><g transform="translate(570 35)"><re