<svg xmlns="http://www.w3.org/2000/svg" width="392" height="408" viewBox="0 0 392 408"><style>@keyframes travel{to{stroke-dashoffset:-640}}@keyframes breathe{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}.ribbon{animation:travel 8s linear infinite}.other{animation-duration:9.6s;animation-delay:-3s}.food{animation:breathe 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.second{animation-delay:-2.1s}@media(prefers-reduced-motion:reduce){.ribbon,.food{animation:none}}</style><defs><linearGradient id="background" x2="0" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient><clipPath id="board"><rect width="200" height="130" rx="16"/></clipPath></defs><rect width="100%" height="100%" rx="16" fill="url(#background)"/><g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="20" y="76" font-size="36" font-weight="700" letter-spacing="-.5" fill="#fff">Nibbles HD</text><text x="20" y="104" font-size="12" fill="#a8a29e">Autonomous snake. Quiet, continuous play.</text><rect x="20" y="128" width="66" height="22" rx="11" fill="#1a1a1a" stroke="#60a5fa" stroke-width=".8"/><text x="53.0" y="142" font-size="9" font-weight="500" text-anchor="middle" fill="#d8e5e7">Offline</text><rect x="94" y="128" width="74" height="22" rx="11" fill="#1a1a1a" stroke="#a78bfa" stroke-width=".8"/><text x="131.0" y="142" font-size="9" font-weight="500" text-anchor="middle" fill="#d8e5e7">8 controls</text><rect x="176" y="128" width="84" height="22" rx="11" fill="#1a1a1a" stroke="#4ade80" stroke-width=".8"/><text x="218.0" y="142" font-size="9" font-weight="500" text-anchor="middle" fill="#d8e5e7">No tracking</text><rect x="268" y="128" width="88" height="22" rx="11" fill="#1a1a1a" stroke="#fbbf24" stroke-width=".8"/><text x="312.0" y="142" font-size="9" font-weight="500" text-anchor="middle" fill="#d8e5e7">No analytics</text></g><g transform="translate(84 207) scale(1.12)"><rect width="200" height="130" rx="16" fill="#1b2e38" stroke="#415864"/><g clip-path="url(#board)"><path d="M20 24H170Q180 24 180 34V98Q180 108 170 108H30Q20 108 20 98V34Q20 24 30 24Z" fill="none" stroke="#90c6bf" stroke-width="9" stroke-linecap="round" stroke-dasharray="105 535" class="ribbon"/><path d="M24 68H60Q70 68 70 78V92Q70 104 82 104H152Q166 104 166 90V46Q166 30 152 30H100Q88 30 88 42V52Q88 68 104 68H170" fill="none" stroke="#dfb77e" stroke-width="8" stroke-linecap="round" stroke-dasharray="82 558" stroke-dashoffset="-170" class="ribbon other"/><circle cx="40" cy="42" r="5" fill="#fbbf24" class="food"/><circle cx="138" cy="81" r="5" fill="#a78bfa" class="food second"/></g></g></svg>
